{% extends 'inventario/base.html' %}
{% block content %}

<style>
    .card-painel {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border: 1px solid #dee2e6 !important;
        border-bottom: 4px solid var(--turquesa-automacao) !important;
        border-radius: 8px;
    }
    .card-painel:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>

<div class="container mt-5">
    <div class="mb-4 text-center">
        <h2 class="fw-bold" style="color: var(--azul-escuro);"><i class="bi bi-receipt-cutoff me-2"></i>Centro Fiscal</h2>
        <p class="text-muted">Gestão de Documentos Fiscais e Devoluções</p>
    </div>
    
    <div class="row g-4 justify-content-center">
        
        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'emitir_notas' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-receipt" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Fila Fiscal</h5>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_consulta_nfe' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-search" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Consultar NF-e</h5>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_consulta_nfce' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-receipt-cutoff" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Consultar NFC-e</h5>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_devolucoes' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-arrow-counterclockwise" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Devoluções</h5>
                </a>
            </div>
        </div>

    </div>
    
    <div class="text-center mt-5">
        <a href="{% url 'tela_painel_gerencia' %}" class="btn fw-bold px-4 py-2" style="background-color: #e9ecef; color: var(--azul-escuro); border: none;">
            <i class="bi bi-arrow-left me-2"></i>Voltar à Gerência
        </a>
    </div>
</div>
{% endblock %}
