{% extends 'inventario/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid mt-4 px-md-4" style="max-width: 800px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded border-start border-4 border-info w-100">
        <h4 class="mb-0 fw-bold" style="color: var(--azul-escuro);">
            <i class="bi bi-shop me-2 text-info"></i> Dados da Loja
        </h4>
        <div>
            <a href="{% url 'tela_configuracoes_sistema' %}" class="btn btn-outline-secondary fw-bold shadow-sm">
                ⬅️ Voltar
            </a>
        </div>
    </div>

    {% if messages %}
        <div class="mb-3">
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show shadow-sm" role="alert">
                    <strong class="fw-bold">{{ message }}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'salvar_configuracoes_sistema' %}">
        {% csrf_token %}
        <input type="hidden" name="origem" value="loja">
        
        <div class="card shadow-sm border-0 mb-4" style="border-top: 4px solid var(--turquesa-automacao) !important;">
            <div class="card-body p-4">
                <p class="small text-muted mb-3">Estes dados sairão no cabeçalho do Cupom Bobina, PDF A4 e Ticket do Pedido.</p>
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary mb-1">Nome da Loja (Razão Social ou Fantasia)</label>
                    <input type="text" name="razao_social" class="form-control form-control-lg fw-bold" value="{{ loja.razao_social }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary mb-1">CNPJ</label>
                    <input type="text" name="cnpj" class="form-control" value="{{ loja.cnpj|default_if_none:'' }}">
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary mb-1">Endereço Completo</label>
                    <textarea name="endereco" class="form-control" rows="3">{{ loja.endereco|default_if_none:'' }}</textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary mb-1">Telefone / WhatsApp</label>
                    <input type="text" name="telefone" class="form-control" value="{{ loja.telefone|default_if_none:'' }}">
                </div>
            </div>
            <div class="card-footer bg-light text-end p-3">
                <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm">💾 Salvar Dados da Loja</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
