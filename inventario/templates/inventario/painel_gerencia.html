{% extends 'inventario/base.html' %}
{% block content %}

<style>
    /* Efeito moderno SaaS para os botões do painel */
    .card-painel {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border: 1px solid #dee2e6 !important;
        border-bottom: 4px solid var(--turquesa-automacao) !important;
        border-radius: 8px;
    }
    .card-painel:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>

<div class="container mt-5">
    <div class="mb-4 text-center">
        <h2 class="fw-bold" style="color: var(--azul-escuro);">Painel de Gerência</h2>
        <p class="text-muted">Escolha uma das áreas abaixo para gerenciar:</p>
    </div>
    
    <div class="row g-4 justify-content-center">
        
        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_manutencao_pontos' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-gift" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Pontos</h5>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_colaboradores' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-people" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Colaboradores</h5>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="/gerenciapainel/centrofiscal/" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-receipt-cutoff" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Centro Fiscal</h5>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="/gerenciapainel/relatoriospainel/" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-bar-chart-line-fill" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Relatórios</h5>
                </a>
            </div>
        </div>

        <!-- NOVO BOTÃO: Configurações do Sistema -->
        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_configuracoes_sistema' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-gear-fill" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Configurações</h5>
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
