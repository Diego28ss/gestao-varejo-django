{% extends 'inventario/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Gerenciamento de Estoque</h2>
    
    <div class="row text-center">
        <div class="col-md-6 mb-3">
            <div class="card h-100 shadow-sm">
                <a href="{% url 'tela_estoque_produtos' %}" class="card-body text-decoration-none text-dark d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-boxes" style="font-size: 3rem; color: #C60C30;"></i>
                    <h4 class="mt-3">Consultar Produtos</h4>
                    <p class="text-muted">Controle de saldo e preços</p>
                </a>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card h-100 shadow-sm">
                <a href="{% url 'tela_entrada_carga' %}" class="card-body text-decoration-none text-dark d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-truck" style="font-size: 3rem; color: #C60C30;"></i>
                    <h4 class="mt-3">Entrada de Carga</h4>
                    <p class="text-muted">Gerencie a entrada de novos itens</p>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
