{% extends 'inventario/base.html' %}
{% block content %}

<style>
    .card-painel {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border: 1px solid #dee2e6 !important;
        border-bottom: 4px solid var(--turquesa-automacao) !important;
        border-radius: 8px;
    }
    .card-painel:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>

<div class="container mt-5">
    <h2 class="mb-4 fw-bold" style="color: var(--azul-escuro);">Gerenciamento de Estoque</h2>
    
    <div class="row text-center justify-content-center">
        <!-- Card: Consultar Produtos (Acesso Livre) -->
        <div class="col-md-3 mb-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_estoque_produtos' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-boxes" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Consultar Produtos</h5>
                    <p class="text-muted small">Controle de saldo e preços</p>
                </a>
            </div>
        </div>

        <!-- Card: Entrada de Carga -->
        <div class="col-md-3 mb-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_entrada_carga' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center"
                   data-perfis-permitidos="Gerente,Supervisor" data-acao-desc="dar entrada em notas e cargas">
                    <i class="bi bi-truck" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Entrada de Carga</h5>
                    <p class="text-muted small">Gerencie a entrada de novos itens</p>
                </a>
            </div>
        </div>

        <!-- Card: Suprir Estoque -->
        <div class="col-md-3 mb-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_suprir_estoque' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center"
                   data-perfis-permitidos="Gerente,Supervisor" data-acao-desc="gerenciar suprimentos do estoque">
                    <i class="bi bi-cart-plus-fill" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Suprir Estoque</h5>
                    <p class="text-muted small">Cálculo Inteligente de Compras</p>
                </a>
            </div>
        </div>

        <!-- 🚀 Card Atualizado: Inventário Rotativo -->
        <div class="col-md-3 mb-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_inventario_dinamico' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center"
                   data-perfis-permitidos="Gerente,Supervisor" data-acao-desc="realizar auditoria de inventário">
                    <i class="bi bi-arrow-repeat" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h5 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Inventário Rotativo</h5>
                    <p class="text-muted small">Contagem com loja aberta</p>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
