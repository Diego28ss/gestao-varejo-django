{% extends 'inventario/base.html' %}

{% block content %}
<div class="row g-3">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-header bg-primary text-white fw-bold">🛒 Carrinho de Compras</div>
            <div class="p-3">

                <div id="areaTags" class="d-flex flex-wrap mb-2"></div>

                <div class="position-relative mb-4">
                    <input type="text" id="inputBusca" class="form-control form-control-lg shadow-sm border-primary" placeholder="Digite Marca, Família ou Cor e dê ENTER para fixar o filtro..." onkeyup="tratarInputBusca(event, this)">

                    <div id="resultadosBusca" class="list-group shadow-lg position-absolute w-100 mt-1" style="z-index: 1000; display: none; max-height: 300px; overflow-y: auto;"></div>
                </div>

                <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-hover align-middle text-center">
                        <thead class="table-light">
                            <tr>
                                <th class="text-start">Produto</th>
                                <th width="100">Qtd</th>
                                <th width="120">Unit.</th>
                                <th width="120">Total</th>
                                <th width="50"></th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCarrinho"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm border-0 bg-dark text-white p-4 h-100">
            <h3 class="text-center mb-4 fw-bold">FECHAMENTO</h3>

            <div class="mb-3">
                <label class="form-label small text-info fw-bold">👤 Cliente</label>
                <select id="selectCliente" class="form-select bg-secondary text-white border-0" onchange="verificarPontos()">
                    <option value="">CONSUMIDOR PADRÃO</option>
                    {% for c in clientes %}
                    <option value="{{ c.nome }}">{{ c.nome }}</option>
                    {% endfor %}
                </select>

                <div id="areaResgatePontos" class="mt-2" style="display: none;"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small text-info fw-bold">👷 Indicante / Pintor</label>
                <select id="selectIndicante" class="form-select bg-secondary text-white border-0">
                    <option value="">-- NENHUM INDICANTE --</option>
                    {% for pintor in pintores %}
                    <option value="{{ pintor.nome }}">{{ pintor.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label small text-info fw-bold">💼 Vendedor</label>
                <select id="selectVendedor" class="form-select bg-secondary text-white border-0">
                    {% for v in vendedores %}
                    <option value="{{ v.login }}">{{ v.login }}</option>
                    {% endfor %}
                </select>
            </div>

            <hr class="opacity-25 my-4">

            <div class="d-flex justify-content-between mb-2 fs-5">
                <span>Subtotal:</span>
                <strong id="txtSubtotal">R$ 0,00</strong>
            </div>

            <div class="mb-4 mt-3">
                <label class="form-label small fw-bold text-warning">Valor Final a Cobrar (Aplicar Desconto)</label>
                <input type="number" id="inputValorFinal" class="form-control form-control-lg fw-bold text-success text-center fs-3" step="0.01" oninput="atualizarTotais()">
            </div>

            <div class="d-flex gap-2 mb-2">
                <button class="btn btn-info btn-lg w-50 fw-bold py-3 shadow text-dark" onclick="finalizarOperacao('ORCAMENTO')">
                    📝 ORÇAMENTO
                </button>
                <button class="btn btn-success btn-lg w-50 fw-bold py-3 shadow" onclick="finalizarOperacao('VENDA')">
                    💰 VENDA
                </button>
            </div>
            <button class="btn btn-outline-danger btn-sm w-100 mt-2" onclick="limparCarrinho()">Cancelar Operação Atual</button>
        </div>
    </div>
</div>

<script>
    let carrinho = [];
    let tagsBusca = [];
    let pontosParaResgatar = 0; // Guarda os pontos que serão gastos

    // --- LÓGICA DE BUSCA COM TAGS CUMULATIVAS ---
    function tratarInputBusca(event, input) {
        let texto = input.value.trim();

        if (event.key === "Enter" && texto !== "") {
            tagsBusca.push(texto.toUpperCase());
            input.value = "";
            renderizarTags();
            buscarProduto("");
        } else {
            buscarProduto(texto);
        }
    }

    function renderizarTags() {
        let html = '';
        tagsBusca.forEach((tag, index) => {
            html += `<span class="badge bg-primary text-white me-2 mb-2 p-2 fs-6 shadow-sm d-flex align-items-center">
                        ${tag}
                        <i class="bi bi-x-circle ms-2" style="cursor: pointer;" onclick="removerTag(${index})"></i>
                     </span>`;
        });
        document.getElementById('areaTags').innerHTML = html;
    }

    function removerTag(index) {
        tagsBusca.splice(index, 1);
        renderizarTags();
        buscarProduto(document.getElementById('inputBusca').value.trim());
    }

    function buscarProduto(textoDigitado) {
        let termosParaBuscar = [...tagsBusca];
        if (textoDigitado.length > 0) {
            termosParaBuscar.push(textoDigitado);
        }

        let queryFinal = termosParaBuscar.join(" ");

        if (queryFinal.length < 2) {
            document.getElementById('resultadosBusca').style.display = 'none';
            return;
        }

        fetch(`/api/buscar_produtos/?q=${encodeURIComponent(queryFinal)}`)
            .then(res => res.json())
            .then(data => {
                let html = '';
                if(data.produtos.length === 0) {
                    html = '<div class="list-group-item text-muted text-center py-3">Nenhum produto encontrado.</div>';
                } else {
                    data.produtos.forEach(p => {
                        html += `<button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="adicionarAoCarrinho(${p.id}, '${p.nome}', ${p.preco})">
                                    <span class="text-start"><strong>${p.nome}</strong><br><small class="text-muted">Estoque: ${p.estoque}</small></span>
                                    <strong class="text-success fs-5">R$ ${p.preco.toFixed(2).replace('.', ',')}</strong>
                                 </button>`;
                    });
                }
                document.getElementById('resultadosBusca').innerHTML = html;
                document.getElementById('resultadosBusca').style.display = 'block';
            });
    }

    // --- LÓGICA DO CARRINHO ---
    function adicionarAoCarrinho(id, nome, preco) {
        let item = carrinho.find(i => i.id === id);
        if (item) { item.qtd++; } else { carrinho.push({id, nome, preco, qtd: 1}); }

        document.getElementById('resultadosBusca').style.display = 'none';
        document.getElementById('inputBusca').value = '';

        atualizarTela();
        document.getElementById('inputBusca').focus();
    }

    function atualizarTela() {
        let html = '';
        let total = 0;
        carrinho.forEach((item, index) => {
            let totalLinha = item.preco * item.qtd;
            total += totalLinha;
            html += `<tr>
                <td class="text-start fw-bold text-secondary">${item.nome}</td>
                <td><input type="number" class="form-control form-control-sm text-center fw-bold" value="${item.qtd}" min="1" onchange="mudarQtd(${index}, this.value)"></td>
                <td class="text-muted">R$ ${item.preco.toFixed(2).replace('.', ',')}</td>
                <td class="text-dark fw-bold">R$ ${totalLinha.toFixed(2).replace('.', ',')}</td>
                <td><button class="btn btn-sm btn-link text-danger fs-5 p-0" onclick="removerItem(${index})"><i class="bi bi-trash-fill"></i></button></td>
            </tr>`;
        });
        document.getElementById('tabelaCarrinho').innerHTML = html;
        document.getElementById('txtSubtotal').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;

        if (!document.getElementById('inputValorFinal').dataset.modificado) {
            document.getElementById('inputValorFinal').value = total.toFixed(2);
        }
    }

    document.getElementById('inputValorFinal').addEventListener('input', function() {
        this.dataset.modificado = 'true';
    });

    function mudarQtd(index, valor) { carrinho[index].qtd = parseInt(valor) || 1; atualizarTela(); }
    function removerItem(index) { carrinho.splice(index, 1); atualizarTela(); }

    function limparCarrinho() {
        if(confirm("Deseja realmente limpar toda a operação?")) {
            carrinho = [];
            tagsBusca = [];
            pontosParaResgatar = 0;
            renderizarTags();
            document.getElementById('inputBusca').value = '';
            document.getElementById('resultadosBusca').style.display = 'none';
            document.getElementById('inputValorFinal').dataset.modificado = '';
            document.getElementById('selectCliente').value = '';
            document.getElementById('areaResgatePontos').style.display = 'none';
            atualizarTela();
        }
    }

    // --- FASE 5: CONSULTA E RESGATE DE PONTOS ---
    function verificarPontos() {
        let clienteNome = document.getElementById('selectCliente').value;
        let areaResgate = document.getElementById('areaResgatePontos');
        pontosParaResgatar = 0; // Reseta se trocar de cliente
        areaResgate.style.display = 'none';

        if (clienteNome) {
            fetch(`/api/consultar_pontos/?cliente=${encodeURIComponent(clienteNome)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.pontos_utilizaveis > 0) {
                        areaResgate.innerHTML = `
                            <div class="alert alert-info p-2 mb-0 border-info shadow-sm text-center text-dark">
                                <strong class="d-block mb-1">🎁 Saldo: ${data.pontos_totais} pontos</strong>
                                <span class="small d-block mb-2">Vale <b>R$ ${data.valor_reais.toFixed(2).replace('.', ',')}</b> de desconto!</span>
                                <button class="btn btn-sm btn-primary w-100 fw-bold" onclick="aplicarDescontoPontos(${data.pontos_utilizaveis}, ${data.valor_reais})">
                                    💰 RESGATAR AGORA
                                </button>
                            </div>
                        `;
                        areaResgate.style.display = 'block';
                    }
                });
        }
    }

    function aplicarDescontoPontos(pontos, valorDesconto) {
        let subtotal = carrinho.reduce((s, i) => s + (i.preco * i.qtd), 0);
        if (subtotal <= 0) return alert("Adicione produtos no carrinho antes de aplicar o desconto!");

        // Garante que o desconto não seja maior que a compra
        if (valorDesconto > subtotal) valorDesconto = subtotal;

        pontosParaResgatar = pontos; // Salva para enviar pro banco

        let inputFinal = document.getElementById('inputValorFinal');
        inputFinal.value = (subtotal - valorDesconto).toFixed(2);
        inputFinal.dataset.modificado = 'true';

        let areaResgate = document.getElementById('areaResgatePontos');
        areaResgate.innerHTML = `
            <div class="alert alert-success p-2 mb-0 border-success shadow-sm text-center text-dark">
                <strong>✅ R$ ${valorDesconto.toFixed(2).replace('.', ',')} Aplicados!</strong><br>
                <small>(${pontos} pontos serão debitados na finalização)</small>
            </div>
        `;
    }

    // --- SALVAMENTO ---
    function finalizarOperacao(statusSelecionado) {
        if (carrinho.length === 0) return alert("O carrinho está vazio!");

        let subtotal = carrinho.reduce((s, i) => s + (i.preco * i.qtd), 0);
        let valorFinal = parseFloat(document.getElementById('inputValorFinal').value);
        let desconto = subtotal - valorFinal;

        let pacote = {
            cliente: document.getElementById('selectCliente').value,
            indicante: document.getElementById('selectIndicante').value,
            vendedor: document.getElementById('selectVendedor').value,
            status: statusSelecionado,
            valor_final: valorFinal,
            desconto: desconto > 0 ? desconto : 0,
            pontos_resgatados: pontosParaResgatar, // ENVIA OS PONTOS GASTOS!
            carrinho: carrinho
        };

        fetch('/api/salvar_venda/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify(pacote)
        }).then(res => res.json()).then(data => {
            if (data.status === 'sucesso') {
                if(statusSelecionado === 'ORCAMENTO') {
                    alert('📝 Orçamento gerado com sucesso! Nenhum estoque ou ponto foi alterado.');
                }
                window.open(`/cupom/${data.venda_id}/`, '_blank', 'width=400,height=600');
                location.reload();
            } else {
                alert("Erro ao salvar a operação: " + data.mensagem);
            }
        });
    }
</script>
{% endblock %}
