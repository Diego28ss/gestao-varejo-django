{% extends 'inventario/base.html' %}

{% block content %}

<div class="modal fade" id="modalAlertaPDV" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Atenção Necessária</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body fs-6 text-dark" id="textoModalAlerta">
      </div>
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Cancelar Operação</button>
        <button type="button" class="btn btn-danger fw-bold" id="btnConfirmarModal">Sim, Autorizar Venda</button>
      </div>
    </div>
  </div>
</div>

<div class="row g-3">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-header text-white fw-bold" style="background-color: #1565C0;">🛒 Carrinho de Compras</div>
            <div class="p-3">

                <div class="table-responsive mb-4" style="max-height: 350px; overflow-y: auto;">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th class="text-start">Produto</th>
                                <th width="80">Qtd</th>
                                <th width="100">Unit.</th>
                                <th width="110">c/ Desc.</th>
                                <th width="100">Total</th>
                                <th width="40"></th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCarrinho"></tbody>
                    </table>
                </div>

                <hr class="opacity-25 my-3">
                <div id="areaTags" class="d-flex flex-wrap mb-2"></div>
                <div class="position-relative">
                    <input type="text" id="inputBusca" class="form-control form-control-lg shadow-sm border-secondary" placeholder="Digite Marca, Família ou Cor e dê ENTER..." onkeyup="tratarInputBusca(event, this)">
                    <div id="resultadosBusca" class="list-group shadow-lg position-absolute w-100 mt-1" style="z-index: 1000; display: none; max-height: 250px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-5">
        <div class="card shadow-sm border p-4 h-100" style="background-color: #dee2e6; border: 1px solid #ced4da !important;">
            <h3 class="text-center mb-3 fw-bold text-dark">FECHAMENTO</h3>

            <div class="row g-2 mb-2">
                <div class="col-12">
                    <label class="form-label small fw-bold text-dark mb-0">👤 Cliente</label>
                    <select id="selectCliente" class="form-select border-secondary shadow-sm" onchange="verificarPontos()">
                        <option value="">CONSUMIDOR PADRÃO</option>
                        {% for c in clientes %}
                        <option value="{{ c.nome }}">{{ c.nome }}</option>
                        {% endfor %}
                    </select>
                    <div id="areaResgatePontos" class="mt-2" style="display: none;"></div>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold text-dark mb-0">👷 Indicante</label>
                    <select id="selectIndicante" class="form-select border-secondary shadow-sm">
                        <option value="">-- NENHUM --</option>
                        {% for pintor in pintores %}
                        <option value="{{ pintor.nome }}">{{ pintor.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold text-dark mb-0">💼 Vendedor</label>
                    <select id="selectVendedor" class="form-select border-secondary shadow-sm">
                        {% for v in vendedores %}
                        <option value="{{ v.login }}">{{ v.login }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <hr class="my-3" style="border-color: #adb5bd;">

            <div class="d-flex justify-content-between mb-1 fs-6 text-dark">
                <span>Subtotal:</span><strong id="txtSubtotal">R$ 0,00</strong>
            </div>
            <div class="d-flex justify-content-between mb-2 fs-6 text-danger">
                <span>Desconto Oculto:</span><strong id="txtDesconto">- R$ 0,00</strong>
            </div>
            <div class="row g-2 mb-2 mt-1">
                <div class="col-8">
                    <label class="form-label small fw-bold text-dark mb-0">VALOR FINAL</label>
                    <input type="number" id="inputValorFinal" class="form-control fw-bold text-center fs-4 border-secondary shadow-sm" step="0.01" oninput="aplicarDescontoGlobalPorValor()">
                </div>
                <div class="col-4">
                    <label class="form-label small fw-bold text-dark mb-0">Desc. (%)</label>
                    <input type="number" id="inputDescontoPerc" class="form-control fw-bold text-center fs-4 border-secondary shadow-sm" step="0.1" oninput="aplicarDescontoGlobalPorPorcentagem()">
                </div>
            </div>

            <div class="card bg-light border-secondary mt-3 mb-3 shadow-sm">
                <div class="card-header bg-secondary text-white py-1 px-2 fw-bold small"><i class="bi bi-wallet2"></i> PAGAMENTOS</div>
                <div class="card-body p-2">
                    
                    <div class="row g-1 mb-2">
                        <div class="col-5">
                            <select id="selectMetodoPagamento" class="form-select form-select-sm border-secondary fw-bold">
                                <option value="DINHEIRO">Dinheiro</option>
                                <option value="CARTAO_CREDITO">Cartão de Crédito</option>
                                <option value="CARTAO_DEBITO">Cartão de Débito</option>
                                <option value="PIX">PIX</option>
                            </select>
                        </div>
                        <div class="col-5">
                            <input type="number" id="inputValorPagamento" class="form-control form-control-sm text-center fw-bold text-success border-secondary" step="0.01" placeholder="Valor">
                        </div>
                        <div class="col-2">
                            <button class="btn btn-sm btn-dark w-100 fw-bold" onclick="adicionarPagamento()">+</button>
                        </div>
                    </div>

                    <ul id="listaPagamentosUI" class="list-group list-group-flush mb-2 border rounded" style="font-size: 0.85rem; max-height: 90px; overflow-y: auto;">
                        </ul>

                    <div class="d-flex justify-content-between mb-0 small text-primary fw-bold">
                        <span>Total Pago:</span><span id="txtTotalPago">R$ 0,00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-0 small text-danger fw-bold">
                        <span>Falta Pagar:</span><span id="txtFaltaPagar">R$ 0,00</span>
                    </div>
                    <div class="d-flex justify-content-between fs-5 text-success fw-bold border-top pt-1 mt-1">
                        <span>TROCO:</span><span id="txtTroco">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mb-2">
                <button id="btnOrcamento" class="btn w-50 fw-bold py-2 shadow-sm text-dark" style="background-color: #FFB81C; border: none;" onclick="iniciarVerificacao('ORCAMENTO')" disabled>
                    📝 ORÇAMENTO
                </button>
                <button id="btnVenda" class="btn w-50 fw-bold py-2 shadow-sm text-white" style="background-color: #4CAF50; border: none;" onclick="iniciarVerificacao('VENDA')" disabled>
                    💰 VENDA
                </button>
            </div>
            <button class="btn btn-sm w-100 fw-bold text-white bg-danger shadow-sm" onclick="limparCarrinho()">CANCELAR COMPRA</button>
        </div>
    </div>
</div>

<script>
    let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    let pagamentos = JSON.parse(localStorage.getItem('pagamentos')) || []; // 💰 Guarda os pagamentos
    let tagsBusca = [];
    let pointsToRedeem = 0;
    let descontoGlobalAplicado = false;

    window.addEventListener('beforeunload', function (e) {
        if (carrinho.length > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    window.onload = function() {
        if(carrinho.length > 0) atualizarTela();
    };

    function tratarInputBusca(event, input) {
        let texto = input.value.trim();
        if (event.key === "Enter" && texto !== "") {
            tagsBusca.push(texto.toUpperCase());
            input.value = "";
            renderizarTags();
            buscarProduto("");
        } else {
            buscarProduto(texto);
        }
    }

    function renderizarTags() {
        let html = '';
        tagsBusca.forEach((tag, index) => {
            html += `<span class="badge text-white me-2 mb-2 p-2 fs-6 shadow-sm d-flex align-items-center" style="background-color: #888B8D;">
                        ${tag} <i class="bi bi-x-circle ms-2" style="cursor: pointer;" onclick="removerTag(${index})"></i>
                     </span>`;
        });
        document.getElementById('areaTags').innerHTML = html;
    }

    function removerTag(index) {
        tagsBusca.splice(index, 1);
        renderizarTags();
        buscarProduto(document.getElementById('inputBusca').value.trim());
    }

    function buscarProduto(textoDigitado) {
        let termosParaBuscar = [...tagsBusca];
        if (textoDigitado.length > 0) termosParaBuscar.push(textoDigitado);
        let queryFinal = termosParaBuscar.join(" ");

        if (queryFinal.length < 2) {
            document.getElementById('resultadosBusca').style.display = 'none';
            return;
        }

        fetch(`/api/buscar-produtos/?q=${encodeURIComponent(queryFinal)}`)
            .then(res => res.json())
            .then(data => {
                let html = '';
                if(data.produtos.length === 0) {
                    html = '<div class="list-group-item text-muted text-center py-3">Nenhum produto encontrado.</div>';
                } else {
                    data.produtos.forEach((p) => {
                        let nomeSeguro = p.nome.replace(/"/g, '&quot;').replace(/'/g, "\\'");
                        html += `<button type="button"
                                    class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                                    data-id="${p.id}" data-nome="${nomeSeguro}" data-preco="${p.preco_venda}" 
                                    data-custo="${p.preco_custo}" data-estoque="${p.estoque_atual}"
                                    onclick="adicionarDiretoDoBotao(this)">
                                    <span class="text-start"><strong>${p.nome}</strong><br><small class="text-muted">Estoque: ${p.estoque_atual}</small></span>
                                    <strong style="color: #4CAF50;" class="fs-5">R$ ${p.preco_venda.toFixed(2).replace('.', ',')}</strong>
                                 </button>`;
                    });
                }
                document.getElementById('resultadosBusca').innerHTML = html;
                document.getElementById('resultadosBusca').style.display = 'block';
            });
    }

    function adicionarDiretoDoBotao(botao) {
        let id = parseInt(botao.getAttribute('data-id'));
        let nome = botao.getAttribute('data-nome');
        let preco = parseFloat(botao.getAttribute('data-preco'));
        let custo = parseFloat(botao.getAttribute('data-custo'));
        let estoque = parseFloat(botao.getAttribute('data-estoque'));

        let item = carrinho.find(i => i.id === id);
        if (item) {
            item.qtd++;
        } else {
            carrinho.push({ id: id, nome: nome, preco: preco, preco_desconto: preco, custo: custo, estoque: estoque, qtd: 1 });
        }

        document.getElementById('resultadosBusca').style.display = 'none';
        document.getElementById('inputBusca').value = '';
        descontoGlobalAplicado = false;
        atualizarTela();
        document.getElementById('inputBusca').focus();
    }

    function atualizarTela() {
        localStorage.setItem('carrinho', JSON.stringify(carrinho));
        let html = '';
        let totalComDescontosItens = 0;

        carrinho.forEach((item, index) => {
            if (item.preco === undefined) item.preco = item.preco_venda || 0;
            if (item.preco_desconto === undefined) item.preco_desconto = item.preco;
            let totalLinha = item.preco_desconto * item.qtd;
            totalComDescontosItens += totalLinha;

            html += `<tr>
                <td class="text-start fw-bold text-secondary small">${item.nome}</td>
                <td><input type="number" class="form-control form-control-sm text-center fw-bold" value="${item.qtd}" min="1" step="1" oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value == '0') this.value = '1';" onchange="mudarQtd(${index}, this.value)"></td>
                <td class="text-muted align-middle small">R$ ${item.preco.toFixed(2).replace('.', ',')}</td>
                <td><input type="number" class="form-control form-control-sm text-center fw-bold" style="color: #4CAF50;" value="${item.preco_desconto.toFixed(2)}" step="0.01" min="0" onchange="mudarPrecoDesconto(${index}, this.value)"></td>
                <td class="text-dark fw-bold align-middle small">R$ ${totalLinha.toFixed(2).replace('.', ',')}</td>
                <td><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="removerItem(${index})"><i class="bi bi-trash-fill"></i></button></td>
            </tr>`;
        });

        document.getElementById('tabelaCarrinho').innerHTML = html;

        if (!descontoGlobalAplicado) {
            document.getElementById('inputValorFinal').value = totalComDescontosItens.toFixed(2);
            document.getElementById('inputDescontoPerc').value = '';
        }

        atualizarResumoCaixa();

        const btnOrcamento = document.getElementById('btnOrcamento');
        const btnVenda = document.getElementById('btnVenda');
        if (carrinho.length === 0) {
            if(btnOrcamento) btnOrcamento.disabled = true;
            if(btnVenda) btnVenda.disabled = true;
        } else {
            if(btnOrcamento) btnOrcamento.disabled = false;
            if(btnVenda) btnVenda.disabled = false;
        }
    }

    function mudarQtd(index, valor) {
        carrinho[index].qtd = parseInt(valor) || 1;
        descontoGlobalAplicado = false;
        atualizarTela();
    }

    function mudarPrecoDesconto(index, valor) {
        carrinho[index].preco_desconto = parseFloat(valor) || carrinho[index].preco;
        descontoGlobalAplicado = false;
        atualizarTela();
    }

    function removerItem(index) {
        carrinho.splice(index, 1);
        descontoGlobalAplicado = false;
        atualizarTela();
    }

    function aplicarDescontoGlobalPorPorcentagem() {
        let perc = parseFloat(document.getElementById('inputDescontoPerc').value) || 0;
        let totalItens = carrinho.reduce((s, i) => s + (i.preco_desconto * i.qtd), 0);
        let novoValorFinal = totalItens - (totalItens * (perc / 100));
        document.getElementById('inputValorFinal').value = novoValorFinal.toFixed(2);
        descontoGlobalAplicado = true;
        atualizarResumoCaixa();
    }

    function aplicarDescontoGlobalPorValor() {
        let valorFinalInput = parseFloat(document.getElementById('inputValorFinal').value) || 0;
        let totalItens = carrinho.reduce((s, i) => s + (i.preco_desconto * i.qtd), 0);
        if (totalItens > 0) {
            let perc = ((totalItens - valorFinalInput) / totalItens) * 100;
            document.getElementById('inputDescontoPerc').value = perc.toFixed(2);
        } else {
            document.getElementById('inputDescontoPerc').value = '';
        }
        descontoGlobalAplicado = true;
        atualizarResumoCaixa();
    }

    function atualizarResumoCaixa() {
        let subtotalOriginal = carrinho.reduce((s, i) => s + (i.preco * i.qtd), 0);
        let valorFinal = parseFloat(document.getElementById('inputValorFinal').value) || 0;
        let economiaTotal = subtotalOriginal - valorFinal;
        
        document.getElementById('txtSubtotal').innerText = `R$ ${subtotalOriginal.toFixed(2).replace('.', ',')}`;
        document.getElementById('txtDesconto').innerText = `- R$ ${economiaTotal > 0 ? economiaTotal.toFixed(2).replace('.', ',') : '0,00'}`;
        
        // 💰 Após recalcular os valores, chama a função para recalcular o troco e pagamentos
        calcularPagamentos(valorFinal);
    }

    // =======================================================
    // 💰 LÓGICA DE MÚLTIPLOS PAGAMENTOS E TROCO
    // =======================================================
    function adicionarPagamento() {
        let metodo = document.getElementById('selectMetodoPagamento').value;
        let metodoNome = document.getElementById('selectMetodoPagamento').options[document.getElementById('selectMetodoPagamento').selectedIndex].text;
        let valorInput = document.getElementById('inputValorPagamento');
        let valor = parseFloat(valorInput.value);

        if (isNaN(valor) || valor <= 0) {
            return alert("Digite um valor válido para o pagamento!");
        }

        pagamentos.push({ metodo: metodo, metodoNome: metodoNome, valor: valor });
        
        let valorFinal = parseFloat(document.getElementById('inputValorFinal').value) || 0;
        calcularPagamentos(valorFinal);
        
        // Coloca o foco de volta no input de busca para continuar vendendo rápido
        document.getElementById('inputBusca').focus();
    }

    function removerPagamento(index) {
        pagamentos.splice(index, 1);
        let valorFinal = parseFloat(document.getElementById('inputValorFinal').value) || 0;
        calcularPagamentos(valorFinal);
    }

    function calcularPagamentos(valorTotalCompra) {
        localStorage.setItem('pagamentos', JSON.stringify(pagamentos));

        let totalPago = pagamentos.reduce((sum, p) => sum + p.valor, 0);
        let falta = valorTotalCompra - totalPago;
        let troco = 0;

        if (falta <= 0) {
            troco = Math.abs(falta);
            falta = 0;
        }

        // Atualiza os textos na tela
        document.getElementById('txtTotalPago').innerText = `R$ ${totalPago.toFixed(2).replace('.', ',')}`;
        document.getElementById('txtFaltaPagar').innerText = `R$ ${falta.toFixed(2).replace('.', ',')}`;
        document.getElementById('txtTroco').innerText = `R$ ${troco.toFixed(2).replace('.', ',')}`;

        // Atualiza a lista visual
        let htmlLista = '';
        if (pagamentos.length === 0) {
            htmlLista = '<li class="list-group-item text-muted text-center py-1">Nenhum pagamento inserido.</li>';
        } else {
            pagamentos.forEach((p, index) => {
                htmlLista += `
                <li class="list-group-item d-flex justify-content-between align-items-center py-1">
                    <span>${p.metodoNome}</span>
                    <div>
                        <strong class="text-success me-2">R$ ${p.valor.toFixed(2).replace('.', ',')}</strong>
                        <button class="btn btn-sm text-danger p-0 m-0" onclick="removerPagamento(${index})"><i class="bi bi-x-circle-fill"></i></button>
                    </div>
                </li>`;
            });
        }
        document.getElementById('listaPagamentosUI').innerHTML = htmlLista;

        // Sugere o valor restante no campo de input automaticamente
        document.getElementById('inputValorPagamento').value = falta > 0 ? falta.toFixed(2) : '';
    }

    // =======================================================
    // CONTINUAÇÃO DA LÓGICA ANTERIOR (LIMPEZA, PONTOS E ENVIAR)
    // =======================================================
    function limparCarrinho() {
        if(confirm("Deseja realmente limpar toda a operação?")) {
            carrinho = [];
            pagamentos = []; // Limpa os pagamentos também
            localStorage.removeItem('carrinho'); 
            localStorage.removeItem('pagamentos'); 
            tagsBusca = [];
            pointsToRedeem = 0;
            descontoGlobalAplicado = false;
            renderizarTags();
            document.getElementById('inputBusca').value = '';
            document.getElementById('resultadosBusca').style.display = 'none';
            document.getElementById('selectCliente').value = '';
            document.getElementById('areaResgatePontos').style.display = 'none';
            atualizarTela();
        }
    }

    function verificarPontos() {
        let clienteNome = document.getElementById('selectCliente').value;
        let areaResgate = document.getElementById('areaResgatePontos');
        pointsToRedeem = 0;
        areaResgate.style.display = 'none';
        if (clienteNome) {
            fetch(`/api/consultar-pontos/?cliente=${encodeURIComponent(clienteNome)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.pontos_utilizaveis > 0) {
                        areaResgate.innerHTML = `
                            <div class="alert p-2 mb-0 shadow-sm text-center text-dark" style="background-color: #FFB81C; border: none;">
                                <strong class="d-block mb-1">🎁 Saldo: ${data.pontos_totais} pontos</strong>
                                <span class="small d-block mb-2">Vale <b>R$ ${data.valor_reais.toFixed(2).replace('.', ',')}</b> de desconto!</span>
                                <button type="button" class="btn btn-sm text-white fw-bold w-100" style="background-color: #101820;" onclick="aplicarDescontoPontos(${data.pontos_utilizaveis}, ${data.valor_reais})">
                                    💰 RESGATAR AGORA
                                </button>
                            </div>`;
                        areaResgate.style.display = 'block';
                    }
                });
        }
    }

    function aplicarDescontoPontos(pontos, valorDesconto) {
        let totalComDescontosItens = carrinho.reduce((s, i) => s + (i.preco_desconto * i.qtd), 0);
        if (totalComDescontosItens <= 0) return alert("Adicione produtos no carrinho antes de aplicar o desconto!");
        if (valorDesconto > totalComDescontosItens) valorDesconto = totalComDescontosItens;
        pointsToRedeem = pontos;
        let inputFinal = document.getElementById('inputValorFinal');
        inputFinal.value = (totalComDescontosItens - valorDesconto).toFixed(2);
        aplicarDescontoGlobalPorValor(); // Isto também vai disparar o recálculo dos pagamentos
        document.getElementById('areaResgatePontos').innerHTML = `
            <div class="alert p-2 mb-0 shadow-sm text-center text-white" style="background-color: #4CAF50; border: none;">
                <strong>✅ R$ ${valorDesconto.toFixed(2).replace('.', ',')} Aplicados!</strong><br>
                <small>(${pontos} pontos serão debitados na finalização)</small>
            </div>`;
    }

    function iniciarVerificacao(statusSelecionado) {
        if (carrinho.length === 0) return alert("O carrinho está vazio!");

        // 💰 TRAVA DE PAGAMENTO (Só bloqueia se for VENDA. Orçamento não precisa de pagamento na hora)
        let valorFinal = parseFloat(document.getElementById('inputValorFinal').value) || 0;
        let totalPago = pagamentos.reduce((sum, p) => sum + p.valor, 0);
        
        if (statusSelecionado === 'VENDA' && totalPago < valorFinal) {
            let valorFaltante = (valorFinal - totalPago).toFixed(2).replace('.', ',');
            return alert(`Operação Bloqueada: Ainda falta pagar R$ ${valorFaltante} para finalizar esta venda.`);
        }

        let avisos = [];
        carrinho.forEach(item => {
            if (statusSelecionado === 'VENDA' && item.qtd > item.estoque && !item.id.toString().startsWith('TINTA-')) {
                let falta = item.qtd - item.estoque;
                avisos.push(`<li><b>${item.nome}</b>: Estoque Insuficiente (Tem ${item.estoque}, Faltam ${falta}).</li>`);
            }
            if (item.custo && item.custo > 0 && item.preco_desconto <= item.custo) {
                avisos.push(`<li><b>${item.nome}</b>: Preço final (R$ ${item.preco_desconto.toFixed(2)}) está abaixo ou igual ao custo.</li>`);
            }
        });

        if (avisos.length > 0) {
            let htmlAvisos = `<p>O sistema identificou os seguintes alertas de segurança:</p><ul class="text-danger">`;
            avisos.forEach(a => htmlAvisos += a);
            htmlAvisos += `</ul><p class="mt-3 fw-bold mb-0">Deseja ignorar os avisos e prosseguir mesmo assim?</p>`;
            
            document.getElementById('textoModalAlerta').innerHTML = htmlAvisos;
            document.getElementById('btnConfirmarModal').onclick = function() {
                let modalEl = document.getElementById('modalAlertaPDV');
                let modalInstance = bootstrap.Modal.getInstance(modalEl);
                modalInstance.hide();
                enviarVendaAPI(statusSelecionado, totalPago);
            };

            let modalAlerta = new bootstrap.Modal(document.getElementById('modalAlertaPDV'));
            modalAlerta.show();

        } else {
            enviarVendaAPI(statusSelecionado, totalPago);
        }
    }

    function enviarVendaAPI(statusSelecionado, totalPago) {
        const btnOrcamento = document.getElementById('btnOrcamento');
        const btnVenda = document.getElementById('btnVenda');
        
        if (statusSelecionado === 'ORCAMENTO') {
            btnOrcamento.disabled = true;
            btnOrcamento.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processando...';
            btnVenda.disabled = true;
        } else {
            btnVenda.disabled = true;
            btnVenda.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processando...';
            btnOrcamento.disabled = true;
        }

        let subtotalComDescontosItens = carrinho.reduce((s, i) => s + (i.preco_desconto * i.qtd), 0);
        let valorFinal = parseFloat(document.getElementById('inputValorFinal').value) || 0;
        let descontoGlobalAdicional = subtotalComDescontosItens - valorFinal;
        
        // Calcula o troco para enviar para a API guardar no cupão
        let trocoReal = totalPago > valorFinal ? (totalPago - valorFinal) : 0;

        let pacote = {
            cliente: document.getElementById('selectCliente').value,
            indicante: document.getElementById('selectIndicante').value,
            vendedor: document.getElementById('selectVendedor').value,
            status: statusSelecionado,
            valor_final: valorFinal,
            desconto: descontoGlobalAdicional > 0 ? descontoGlobalAdicional : 0,
            pontos_resgatados: pointsToRedeem,
            carrinho: carrinho,
            pagamentos: pagamentos, // 💰 Envia os pagamentos para o Python
            troco: trocoReal
        };

        fetch('/api/salvar-venda/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify(pacote)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'sucesso') {
                carrinho = []; 
                pagamentos = [];
                localStorage.removeItem('carrinho'); 
                localStorage.removeItem('pagamentos'); 
                
                if(statusSelecionado === 'ORCAMENTO') {
                    alert('📝 Orçamento gerado com sucesso!');
                } else {
                    alert('✅ Venda finalizada com sucesso! Troco: R$ ' + trocoReal.toFixed(2).replace('.', ','));
                }
                window.open(`/venda/cupom/${data.venda_id}/`, '_blank', 'width=1024,height=850,scrollbars=yes,resizable=yes');
                location.reload();
            } else {
                alert("Erro ao salvar a operação: " + data.mensagem);
                restaurarBotoesFinalizar(); 
            }
        })
        .catch(err => {
            alert("Erro de conexão com o servidor. Verifique a internet e tente novamente.");
            restaurarBotoesFinalizar(); 
        });
    }

    function restaurarBotoesFinalizar() {
        const btnOrcamento = document.getElementById('btnOrcamento');
        const btnVenda = document.getElementById('btnVenda');
        if(btnOrcamento) { btnOrcamento.disabled = false; btnOrcamento.innerHTML = '📝 ORÇAMENTO'; }
        if(btnVenda) { btnVenda.disabled = false; btnVenda.innerHTML = '💰 VENDA'; }
    }
</script>
{% endblock %}
