{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecVarejo | Login</title>
    
    <link rel="icon" type="image/jpeg" href="{% static 'img/tecvarejoicone.jpg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fundo com a Imagem da Loja e um leve escurecimento */
        body {
            background: linear-gradient(135deg, rgba(13, 27, 76, 0.6) 0%, rgba(42, 44, 46, 0.6) 100%), 
                        url("{% static 'img/bg_login.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Cartão de Login: Efeito Glassmorphism com Borda Turquesa */
        .card-login {
            background-color: rgba(13, 27, 76, 0.45); /* Azul escuro corporativo muito transparente */
            backdrop-filter: blur(12px); /* O desfoque mágico do fundo */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 184, 212, 0.6) !important; /* Borda Turquesa */
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 184, 212, 0.15) !important; /* Brilho turquesa suave */
            width: 100%; 
            max-width: 420px; 
            padding: 2rem;
            color: #ffffff;
        }

        /* Campos de input translúcidos */
        .form-control {
            background-color: rgba(255, 255, 255, 0.05) !important;
            color: #ffffff !important;
            border: 1px solid rgba(0, 184, 212, 0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }
        
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.1) !important;
            border-color: #00B8D4;
            box-shadow: 0 0 10px rgba(0, 184, 212, 0.4);
        }
        
        /* Modificando o placeholder para ficar legível */
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Botão Azul de Confiança */
        .btn-login {
            background-color: #1565C0;
            border-color: #1565C0;
            color: white;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            background-color: #00B8D4; /* Muda para o Turquesa Automação ao passar o rato */
            border-color: #00B8D4;
            color: #0D1B4C;
            font-weight: 700;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 184, 212, 0.4);
        }
    </style>
</head>
<body>

<div class="card-login">
    <div class="text-center mb-4 pt-2">
        <div class="d-flex align-items-center justify-content-center mb-2">
            <img src="{% static 'img/tecvarejoicone.jpg' %}" alt="Logo TecVarejo" class="rounded me-3 shadow" style="width: 50px; height: 50px; object-fit: cover; border: 1px solid rgba(0, 184, 212, 0.5);">
            <h2 class="mb-0 fw-bold" style="letter-spacing: -0.5px; font-size: 2.2rem;">
                <span style="color: #ffffff;">Tec</span><span style="color: #00B8D4;">Varejo</span>
            </h2>
        </div>
        <small class="fw-semibold" style="color: rgba(255, 255, 255, 0.7);">Tecnologia em Gestão e Vendas</small>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger text-center fw-bold shadow-sm" style="background-color: rgba(220, 53, 69, 0.8); color: white; border: none;" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="">
        {% csrf_token %}

        <div class="mb-4">
            <label class="form-label fw-bold" style="color: rgba(255, 255, 255, 0.9);">Utilizador</label>
            <input type="text" name="login" class="form-control form-control-lg shadow-sm" required autofocus autocomplete="username">
        </div>

        <div class="mb-5">
            <label class="form-label fw-bold" style="color: rgba(255, 255, 255, 0.9);">Palavra-passe</label>
            <input type="password" name="senha" class="form-control form-control-lg shadow-sm" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-login btn-lg w-100 fw-bold shadow-sm py-3 mb-2">Entrar no Sistema</button>
    </form>
</div>

</body>
</html>
