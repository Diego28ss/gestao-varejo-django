<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VarejoBoost | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fundo Escuro Premium (Preto Solid com um toque de Cinza Escuro) */
        body {
            background: linear-gradient(135deg, #101820 0%, #2A2C2E 100%);
            height: 100vh;
        }
        /* Cartão de Login escurecido com borda subtil em Cinza Cool Gray */
        .card {
            background-color: #1a1e22;
            border: 1px solid #888B8D !important;
            border-radius: 12px;
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.5) !important;
        }

        .text-secondary { color: #888B8D !important; }

        /* Campos de input adaptados para o tema escuro */
        input.form-control {
            background-color: #2b3035 !important;
            color: white !important;
            border-color: #888B8D;
        }
        input.form-control:focus {
            border-color: #C60C30;
            box-shadow: 0 0 0 0.25rem rgba(198, 12, 48, 0.25);
        }

        /* Botão Vermelho Institucional */
        .btn-login {
            background-color: #C60C30;
            border-color: #C60C30;
            color: white;
        }
        .btn-login:hover {
            background-color: #9c0925;
            border-color: #9c0925;
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="card border-0" style="width: 100%; max-width: 420px;">
    <div class="card-header border-0 text-center pt-5 pb-2 rounded-top" style="background-color: transparent;">
        <h2 class="mb-0 fw-bold" style="color: #C60C30;">🚀 VarejoBoost</h2>
        <small class="fw-semibold text-light">Tecnologia em Gestão e Vendas</small>
    </div>

    <div class="card-body p-4 pt-3 pb-5">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger text-center fw-bold" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Utilizador</label>
                <input type="text" name="login" class="form-control form-control-lg" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Palavra-passe</label>
                <input type="password" name="senha" class="form-control form-control-lg" required>
            </div>

            <button type="submit" class="btn btn-login btn-lg w-100 fw-bold shadow-sm">Entrar no Sistema</button>
        </form>

    </div>
</div>

</body>
</html>
