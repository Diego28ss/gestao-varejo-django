<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JB Tintas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow-lg border-0" style="width: 100%; max-width: 400px;">
    <div class="card-header bg-dark text-white text-center py-4">
        <h3 class="mb-0">🎨 JB Tintas</h3>
        <small class="text-muted">Acesso Restrito ao Sistema</small>
    </div>

    <div class="card-body p-4">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger text-center" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold">Utilizador</label>
                <input type="text" name="login" class="form-control form-control-lg" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Senha</label>
                <input type="password" name="senha" class="form-control form-control-lg" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Entrar no Sistema</button>
        </form>

    </div>
</div>

</body>
</html>
