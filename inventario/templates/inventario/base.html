<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VarejoBoost | Gestão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body { background-color: #FFFFFF; color: #101820; font-family: sans-serif; }

        /* Navbar */
        .navbar { background-color: #C60C30 !important; z-index: 1000; }
        .navbar-brand, .nav-link { color: #FFFFFF !important; font-weight: 500; }

        /* FORÇANDO O MODAL PARA CIMA DE TUDO */
        .modal { z-index: 2000 !important; }
        .modal-backdrop { z-index: 1999 !important; }

        .card { border: 1px solid #dee2e6 !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'painel_principal' %}">VarejoBoost</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'tela_pdv' %}">PDV</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'tela_painel_estoque' %}">Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'tela_consultar_clientes' %}">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'painel_tintometrico' %}">Tintométrico</a></li>
                    
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tela_painel_gerencia' %}">Gerência</a>
                    </li>
                </ul>
                
                <span class="navbar-text text-white me-3">Olá, <strong>{{ request.session.usuario_logado|upper }}</strong></span>
                
                <a href="{% url 'logout' %}" 
                   style="background-color: #dc3545; color: white; border: none; padding: 6px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; transition: background 0.3s; margin-left: 10px;"
                   onmouseover="this.style.backgroundColor='#a71d2a'" 
                   onmouseout="this.style.backgroundColor='#dc3545'">
                   Sair
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-dismissible fade show shadow-sm fw-bold text-center" style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
