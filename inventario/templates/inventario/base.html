{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VarejoBoost | Gestão ERP</title>
    
    <!-- 🌟 Logo da VarejoBoost na aba do navegador -->
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        /* Cores Globais VarejoBoost */
        :root {
            --azul-confianca: #1565C0;
            --turquesa-automacao: #00B8D4;
            --verde-crescimento: #4CAF50;
            --azul-escuro: #0D1B4C;
            --branco: #FFFFFF;
        }

        body { 
            background-color: var(--branco); 
            color: var(--azul-escuro); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* Navbar Moderna SaaS */
        .navbar { 
            background-color: var(--azul-confianca) !important; 
            border-bottom: 4px solid var(--verde-crescimento);
            z-index: 1000; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .navbar-brand { 
            font-weight: 800; 
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }
        .nav-link { 
            color: var(--branco) !important; 
            font-weight: 500; 
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: var(--turquesa-automacao) !important;
        }

        /* FORÇANDO O MODAL PARA CIMA DE TUDO */
        .modal { z-index: 2000 !important; }
        .modal-backdrop { z-index: 1999 !important; }

        .card { border: 1px solid #dee2e6 !important; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <!-- Aplicação da Marca -->
            <a class="navbar-brand" href="{% url 'painel_principal' %}">
                <span style="color: var(--branco);">varejo</span><span style="color: var(--turquesa-automacao);">boost</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: var(--turquesa-automacao);">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-4">
                    <li class="nav-item"><a class="nav-link" href="{% url 'tela_pdv' %}"><i class="bi bi-cart3 me-1"></i> PDV</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'tela_painel_estoque' %}"><i class="bi bi-box-seam me-1"></i> Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'tela_consultar_clientes' %}"><i class="bi bi-people me-1"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'painel_tintometrico' %}"><i class="bi bi-droplet-half me-1"></i> Tintométrico</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'tela_painel_gerencia' %}"><i class="bi bi-bar-chart-line me-1"></i> Gerência</a></li>
                </ul>
                
                <span class="navbar-text text-white me-3 opacity-75">
                    Olá, <strong>{{ request.session.usuario_logado|upper }}</strong>
                </span>
                
                <!-- Botão de Sair com as novas cores -->
                <a href="{% url 'logout' %}" 
                   style="background-color: var(--azul-escuro); color: var(--branco); border: 1px solid var(--turquesa-automacao); padding: 6px 18px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: all 0.3s; margin-left: 10px;"
                   onmouseover="this.style.backgroundColor='var(--turquesa-automacao)'; this.style.color='var(--azul-escuro)'" 
                   onmouseout="this.style.backgroundColor='var(--azul-escuro)'; this.style.color='var(--branco)'">
                   Sair <i class="bi bi-box-arrow-right ms-1"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-dismissible fade show shadow-sm fw-bold text-center" style="background-color: #e0f2f1; color: var(--azul-escuro); border-left: 5px solid var(--turquesa-automacao);">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
