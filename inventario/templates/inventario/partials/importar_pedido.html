<!-- Modal Importar Pedidos (Caixa) com Leitor de Código de Barras -->
<div class="modal fade" id="modalPedidosPDV" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header text-white" style="background-color: var(--azul-confianca);">
                <h5 class="modal-title fw-bold"><i class="bi bi-cloud-arrow-down-fill me-2"></i>Importar Pedido da Retaguarda</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 bg-light">
                
                <!-- 🚀 BARRA DE PESQUISA / LEITOR DE CÓDIGO DE BARRAS -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary small mb-1">Localizar Pedido Específico</label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-primary">
                            <i class="bi bi-upc-scan fs-4"></i>
                        </span>
                        <input type="text" id="inputBuscaPedidoCaixa" class="form-control border-start-0 fw-bold text-center fs-5" placeholder="Bipe o código de barras ou digite o Nº do pedido..." style="color: var(--azul-escuro);">
                        <button class="btn btn-primary fw-bold px-4" type="button" onclick="pesquisarPedidoDigitado()">
                            Buscar
                        </button>
                    </div>
                    <small class="text-muted mt-2 d-block text-center"><i class="bi bi-info-circle-fill me-1"></i> O leitor pesquisa automaticamente após bipar o ticket.</small>
                </div>

                <!-- TABELA DE PEDIDOS PENDENTES -->
                <h6 class="fw-bold text-secondary mb-2"><i class="bi bi-list-ul me-1"></i> Últimos Pedidos Aguardando Pagamento</h6>
                <div class="table-responsive bg-white border rounded shadow-sm" style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="table-dark sticky-top">
                            <tr>
                                <th>Nº Pedido</th>
                                <th>Vendedor</th>
                                <th>Cliente</th>
                                <th>Total R$</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="listaPedidosPDV">
                            <!-- Injetado pelo JS do pdv.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
