<!-- Modal Tintometrico -->
<div class="modal fade" id="modalTintometrico" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header text-white" style="background-color: var(--azul-escuro);">
        <h5 class="modal-title fw-bold"><i class="bi bi-palette-fill me-2"></i> Adicionar Tinta Preparada</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0" style="background-color: #f8f9fa;">
        
        <div id="menuSistemasTinto" class="p-5 text-center">
            <h4 class="mb-4 fw-bold" style="color: var(--azul-escuro);">Selecione a Máquina / Sistema:</h4>
            <div class="d-flex justify-content-center gap-4 flex-wrap">
                <button class="btn shadow-sm rounded-4" style="background-color: #FF7043; color: white; width: 220px; height: 140px; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" onclick="carregarSistemaTinto('/tintometricopainel/coral/')">
                    <h2 class="fw-bold mb-1">CORAL</h2>
                    <span class="badge bg-light text-dark">Sistema Ativo</span>
                </button>
                <button class="btn btn-secondary shadow-sm rounded-4" style="width: 220px; height: 140px;" disabled>
                    <h2 class="fw-bold mb-1">FUTURA</h2>
                    <span class="badge bg-dark">Em Breve</span>
                </button>
            </div>
        </div>

        <iframe id="iframeTintometrico" src="" style="width: 100%; height: 80vh; border: none; display: none;"></iframe>

      </div>
    </div>
  </div>
</div>
