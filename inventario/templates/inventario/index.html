{% extends 'inventario/base.html' %}

{% block content %}
<div class="row g-4 mt-2">
    <div class="col-md-4">
        <a href="{% url 'tela_pdv' %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 bg-primary text-white text-center p-4">
                <div class="fs-1 mb-3">💰</div>
                <h4 class="fw-bold">Frente de Caixa</h4>
                <p class="small opacity-75 mb-0">Vendas rápidas, orçamentos e cupons.</p>
            </div>
        </a>
    </div>

    <div class="col-md-4">
        <a href="{% url 'tela_estoque_produtos' %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 bg-secondary text-white text-center p-4">
                <div class="fs-1 mb-3">📦</div>
                <h4 class="fw-bold">Estoque & Produtos</h4>
                <p class="small opacity-75 mb-0">Controle de saldo e preços automáticos.</p>
            </div>
        </a>
    </div>

    <div class="col-md-4">
        <a href="{% url 'tela_relatorios' %}" class="text-decoration-none">
            <div class="card shadow-sm border-0 h-100 bg-info text-dark text-center p-4">
                <div class="fs-1 mb-3">📊</div>
                <h4 class="fw-bold">Relatórios</h4>
                <p class="small opacity-75 mb-0">Acompanhe o faturamento da loja.</p>
            </div>
        </a>
    </div>
</div>
{% endblock %}
