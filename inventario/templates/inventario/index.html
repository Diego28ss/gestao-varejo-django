{% extends 'inventario/base.html' %}

{% block content %}
<style>
    /* Padrão moderno aplicado */
    .card-painel {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border: 1px solid #dee2e6 !important;
        border-bottom: 4px solid var(--turquesa-automacao) !important;
        border-radius: 8px;
    }
    .card-painel:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>

<div class="container mt-5">
    <div class="row g-4 justify-content-center mb-4">
        
        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_pdv' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center" target="_blank">
                    <i class="bi bi-cart-fill" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h6 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Caixa PDV</h6>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_painel_estoque' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center" target="_blank">
                    <i class="bi bi-box-seam" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h6 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Estoque</h6>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_consultar_clientes' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center" target="_blank">
                    <i class="bi bi-people-fill" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h6 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Clientes</h6>
                </a>
            </div>
        </div>
    </div>

    <div class="row g-4 justify-content-center">
        
        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'painel_tintometrico' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center" target="_blank">
                    <i class="bi bi-palette-fill" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h6 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Tintométrico</h6>
                </a>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100 shadow-sm card-painel bg-white">
                <a href="{% url 'tela_painel_gerencia' %}" class="card-body text-decoration-none d-flex flex-column justify-content-center align-items-center" target="_blank">
                    <i class="bi bi-bar-chart-line-fill" style="font-size: 3.5rem; color: var(--turquesa-automacao);"></i>
                    <h6 class="mt-3 fw-bold" style="color: var(--azul-escuro);">Gerência</h6>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
