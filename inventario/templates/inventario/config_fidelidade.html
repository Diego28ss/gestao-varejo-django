{% extends 'inventario/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid mt-4 px-md-4" style="max-width: 800px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded border-start border-4 border-warning w-100">
        <h4 class="mb-0 fw-bold" style="color: var(--azul-escuro);">
            <i class="bi bi-star-fill me-2 text-warning"></i> Fidelidade e Pontuação
        </h4>
        <div>
            <a href="{% url 'tela_configuracoes_sistema' %}" class="btn btn-outline-secondary fw-bold shadow-sm">
                ⬅️ Voltar
            </a>
        </div>
    </div>

    {% if messages %}
        <div class="mb-3">
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show shadow-sm" role="alert">
                    <strong class="fw-bold">{{ message }}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'salvar_configuracoes_sistema' %}">
        {% csrf_token %}
        <input type="hidden" name="origem" value="fidelidade">
        
        <div class="card shadow-sm border-0 mb-4" style="border-top: 4px solid #ffc107 !important;">
            <div class="card-body p-4">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input fs-4 shadow-sm" type="checkbox" role="switch" id="switchCliente" name="pontuacao_cliente" {% if config.modulo_pontuacao_cliente_ativo %}checked{% endif %}>
                    <label class="form-check-label ms-2 fw-bold text-dark mt-1" for="switchCliente">
                        <i class="bi bi-person-heart text-primary"></i> Ativar Pontuação para Clientes
                    </label>
                </div>
                <hr class="text-muted">
                <div class="form-check form-switch">
                    <input class="form-check-input fs-4 shadow-sm" type="checkbox" role="switch" id="switchPintor" name="pontuacao_pintor" {% if config.modulo_pontuacao_pintor_ativo %}checked{% endif %}>
                    <label class="form-check-label ms-2 fw-bold text-dark mt-1" for="switchPintor">
                        <i class="bi bi-brush-fill text-success"></i> Ativar Pontuação para Pintores / Indicantes
                    </label>
                </div>
            </div>
            <div class="card-footer bg-light text-end p-3">
                <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm">💾 Salvar Permissões</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
